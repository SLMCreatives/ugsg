<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="wifiTitle">
  <title id="wifiTitle">Illustration of Wi-Fi signal spreading across campus floors</title>

  <defs>
    <linearGradient id="wifiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="0.55" stop-color="#e4eff5"/>
      <stop offset="1" stop-color="#d8e9f1"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064b76" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#064b76" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wifiBg)"/>

  <!-- Building floors: the signal has to reach the far end of each one. -->
  <g fill="url(#floorFade)">
    <rect x="150" y="612" width="1300" height="86" rx="8"/>
    <rect x="150" y="726" width="1300" height="86" rx="8"/>
    <rect x="150" y="840" width="1300" height="86" rx="8"/>
  </g>
  <g fill="#064b76" opacity="0.34">
    <g>
      <rect x="196" y="640" width="34" height="30" rx="4"/><rect x="252" y="640" width="34" height="30" rx="4"/>
      <rect x="308" y="640" width="34" height="30" rx="4"/><rect x="1258" y="640" width="34" height="30" rx="4"/>
      <rect x="1314" y="640" width="34" height="30" rx="4"/><rect x="1370" y="640" width="34" height="30" rx="4"/>
    </g>
    <g>
      <rect x="196" y="754" width="34" height="30" rx="4"/><rect x="252" y="754" width="34" height="30" rx="4"/>
      <rect x="308" y="754" width="34" height="30" rx="4"/><rect x="1258" y="754" width="34" height="30" rx="4"/>
      <rect x="1314" y="754" width="34" height="30" rx="4"/><rect x="1370" y="754" width="34" height="30" rx="4"/>
    </g>
    <g>
      <rect x="196" y="868" width="34" height="30" rx="4"/><rect x="252" y="868" width="34" height="30" rx="4"/>
      <rect x="308" y="868" width="34" height="30" rx="4"/><rect x="1258" y="868" width="34" height="30" rx="4"/>
      <rect x="1314" y="868" width="34" height="30" rx="4"/><rect x="1370" y="868" width="34" height="30" rx="4"/>
    </g>
  </g>

  <!-- Signal arcs radiating from the access point. -->
  <g fill="none" stroke-linecap="round">
    <path d="M404 200 A 560 560 0 0 1 1196 200" stroke="#156595" stroke-opacity="0.20" stroke-width="26"/>
    <path d="M503 299 A 420 420 0 0 1 1097 299" stroke="#156595" stroke-opacity="0.34" stroke-width="26"/>
    <path d="M602 398 A 280 280 0 0 1 998 398" stroke="#156595" stroke-opacity="0.62" stroke-width="26"/>
    <path d="M701 497 A 140 140 0 0 1 899 497" stroke="#f39228" stroke-width="26"/>
  </g>

  <!-- The access point itself. -->
  <circle cx="800" cy="596" r="40" fill="#f39228"/>
  <circle cx="800" cy="596" r="17" fill="#ffffff"/>

  <!-- Devices connecting from the far corners of each floor. -->
  <g>
    <rect x="382" y="742" width="74" height="52" rx="9" fill="#064b76"/>
    <rect x="392" y="752" width="54" height="32" rx="4" fill="#ffffff" opacity="0.86"/>
    <rect x="1146" y="742" width="74" height="52" rx="9" fill="#064b76"/>
    <rect x="1156" y="752" width="54" height="32" rx="4" fill="#ffffff" opacity="0.86"/>
    <rect x="470" y="852" width="42" height="66" rx="9" fill="#156595"/>
    <rect x="478" y="862" width="26" height="40" rx="3" fill="#ffffff" opacity="0.86"/>
    <rect x="1090" y="852" width="42" height="66" rx="9" fill="#156595"/>
    <rect x="1098" y="862" width="26" height="40" rx="3" fill="#ffffff" opacity="0.86"/>
  </g>

  <!-- Connection ticks, brightest nearest the access point. -->
  <g fill="#f39228">
    <circle cx="419" cy="704" r="9" opacity="0.5"/>
    <circle cx="1183" cy="704" r="9" opacity="0.5"/>
    <circle cx="491" cy="818" r="9" opacity="0.35"/>
    <circle cx="1111" cy="818" r="9" opacity="0.35"/>
  </g>
</svg>
